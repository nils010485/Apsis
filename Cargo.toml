[package]
name = "apsis"
version = "0.1.0"
edition = "2024"
description = "apsis - CLI preset manager and stateless MCP server for PostgreSQL, MongoDB, and S3"

[[bin]]
name = "apsis"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aws-sdk-s3 = "1.161"
aws-smithy-types = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive"] }
dirs = "7.0"
either = "1"
futures = "0.3"
keyring = "4"
mongodb = "3.10"
rmcp = { version = "3.11", features = ["server", "macros", "transport-io"] }
rpassword = "7"
schemars = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "json", "chrono", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1.2"
uuid = { version = "1", features = ["serde", "v4"] }
